name: Release

on:
  push:
    tags:
      - "v*" # Trigger when pushing tags starting with 'v' (e.g., v0.1.0, v0.1.0-beta.1)

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Verify build & tests
        run: |
          go build ./...
          go test ./... -race

      - name: Build examples (cross-platform)
        run: |
          chmod +x scripts/build_examples_all.sh
          ./scripts/build_examples_all.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bin/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
