name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 库下限与 CI 工具链解耦：go.mod 声明 go 1.22（消费者最低可用，1.20/1.22 runner
          # 已实证依赖图可编译；1.18 被 klauspost zstd 的 binary.Append*（Go 1.19 API）否决）。
          # 本 job 用 1.25 编译验证（语言档仍按 go.mod 1.22）；漏洞扫描见独立的 vuln-scan job。
          go-version: "1.25"
          cache: true

      - name: Go fmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files need formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...


      - name: Build
        run: go build ./...

      - name: Build examples (verify API usage compiles)
        # examples/ 下的每个示例是独立的 package main + 独立 func main()，不能用同一个 build
        # tag 一起编译（会触发 main redeclared）。为每个示例分配独立 tag，逐个按 tag 编译，
        # 既保证示例对上游 SDK 的 API 调用始终可编译、又不污染默认 go build ./...。
        run: |
          set -e
          for ex in generic oss_v1 oss_v2 sls; do
            echo ">>> building example_${ex}"
            go build -tags="example_${ex}" -o /tmp/example_build_${ex} ./examples
          done

      - name: Test with coverage
        run: |
          go test ./... -race -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out | tail -1
          # 提取 total 行末尾的百分比数值(形如 `42.3%`)。原正则 `[0-9.]+$` 因行尾是 `%`
          # 而无法匹配,导致 cov 恒空、80% 门禁永远通过。用 awk 取最后一列再 strip `%`。
          cov=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | tr -d '%')
          echo "Total coverage: ${cov}%"
          if [ "$(awk -v c="$cov" 'BEGIN{print (c+0 < 80) ? 1 : 0}')" = "1" ]; then
            echo "::error::Coverage ${cov}% is below 80% threshold"
            exit 1
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  vuln-scan:
    name: Vulnerability scan
    # 与下限/构建 job 分离：stdlib 公告只在“最新受支持工具链”里被修复，钉死任何版本号
    # 都会让扫描步骤随公告滚动而常红；构建兼容性由 test job 的 1.25（按 go.mod 1.22 语言档）
    # 验证，漏洞扫描用最新 stable 工具链 + govulncheck@latest，保证判定与公告库同步。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: false

      - name: govulncheck
        run: |
          go version
          go env GOPROXY GOTOOLCHAIN
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
